<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Andreina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #e4deed;
    --sky-glow: #f7eff4;
    --paper: #fbf8fb;
    --ink: #26306e;
    --ink-soft: rgba(38, 48, 110, .11);
    --wax: #8c1d3b;
    --wax-hi: #b8385e;
    --wax-text: #f6dde5;
    --petal: #e6a0b5;
    --muted: #5d567a;
    --env: #dcc6d0;
    --env-inside: #bfa5b3;
    --shadow: rgba(20, 14, 50, .35);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #121530;
      --sky-glow: #2b2352;
      --paper: #f4eff5;
      --muted: #bcb5da;
      --env: #d7c0cb;
      --env-inside: #a88d9c;
      --shadow: rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="dark"] {
    --sky: #121530;
    --sky-glow: #2b2352;
    --paper: #f4eff5;
    --muted: #bcb5da;
    --env: #d7c0cb;
    --env-inside: #a88d9c;
    --shadow: rgba(0, 0, 0, .55);
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--sky);
    color: var(--muted);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse 90% 60% at 50% 18%, var(--sky-glow), var(--sky) 72%);
  }
  #root { min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- Intro / sobre ---------- */
  .intro {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.4rem;
    padding: 2rem 1rem;
    text-align: center;
  }
  .intro.leaving { animation: fadeAway .7s ease 1.45s forwards; }
  .para {
    margin: 0;
    font-style: italic;
    font-size: clamp(1.6rem, 6vw, 2.3rem);
    font-weight: 400;
    color: var(--muted);
    letter-spacing: .01em;
  }
  .hint {
    margin: 0;
    font-style: italic;
    font-size: 1.15rem;
    min-height: 1.5em;
    color: var(--muted);
    opacity: .85;
    animation: breathe 2.8s ease-in-out infinite;
  }

  .envelope {
    position: relative;
    width: min(84vw, 360px);
    aspect-ratio: 1.5;
    perspective: 900px;
  }
  .env-back {
    position: absolute; inset: 0;
    background: var(--env-inside);
    border-radius: 6px;
    box-shadow: 0 34px 60px -24px var(--shadow);
    z-index: 1;
  }
  .env-letter {
    position: absolute;
    left: 7%; right: 7%; top: 7%; bottom: 8%;
    background: var(--paper);
    border-radius: 3px;
    z-index: 2;
    transition: transform 1s cubic-bezier(.2,.7,.2,1) .55s;
    background-image: repeating-linear-gradient(transparent 0 13px, var(--ink-soft) 13px 14px);
    background-origin: content-box;
    padding: 14% 12%;
  }
  .env-front {
    position: absolute; inset: 0;
    background: var(--env);
    clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
    border-radius: 6px;
    z-index: 3;
  }
  .env-flap {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 60%;
    background: var(--env);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .8s ease, z-index 0s linear .4s;
    z-index: 4;
    filter: brightness(1.03);
  }
  .seal {
    position: absolute;
    left: 50%; top: 58%;
    width: 68px; height: 68px;
    transform: translate(-50%, -50%);
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-hi), var(--wax) 62%);
    box-shadow: 0 6px 14px -4px rgba(60, 10, 25, .6), inset 0 -3px 6px rgba(0,0,0,.25);
    color: var(--wax-text);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 2.2rem;
    line-height: 1;
    cursor: pointer;
    z-index: 5;
    transition: transform .3s ease, opacity .4s ease;
  }
  .seal:hover { transform: translate(-50%, -50%) scale(1.06); }
  .seal:focus-visible { outline: 3px solid var(--muted); outline-offset: 5px; }

  .envelope.opened .seal { opacity: 0; transform: translate(-50%, -30%) scale(.8); pointer-events: none; }
  .envelope.opened .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.opened .env-letter { transform: translateY(-48%); }

  /* ---------- Carta ---------- */
  .reading { position: relative; padding: 2.5rem 0 7rem; }
  .letter {
    position: relative;
    z-index: 1;
    width: min(92vw, 620px);
    margin: 0 auto;
    padding: clamp(30px, 7vw, 60px) clamp(22px, 7vw, 58px);
    background-color: var(--paper);
    background-image: repeating-linear-gradient(transparent 0 calc(1.5em - 1px), var(--ink-soft) calc(1.5em - 1px) 1.5em);
    background-origin: content-box;
    color: var(--ink);
    border-radius: 4px;
    box-shadow: 0 40px 80px -34px var(--shadow);
    font-family: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: clamp(1.4rem, 4.8vw, 1.8rem);
    line-height: 1.5;
    animation: rise 1s cubic-bezier(.2,.7,.2,1) both;
  }
  .letter p { margin: 0 0 1.5em; }
  .letter p:last-child { margin-bottom: 0; }
  .letter .saludo { font-weight: 600; }
  .letter .firma { text-align: right; font-weight: 600; }
  .polaroid {
    width: min(64%, 250px);
    margin: 0 auto 1.5em;
    padding: 10px 10px 0;
    background: #fff;
    box-shadow: 0 14px 30px -14px var(--shadow), 0 1px 3px rgba(0,0,0,.12);
    transform: rotate(-3deg);
    animation: settle 1.4s cubic-bezier(.2,.7,.2,1) .4s both;
  }
  .polaroid img { display: block; width: 100%; height: auto; }
  .polaroid figcaption {
    text-align: center;
    padding: .35em .2em .5em;
    line-height: 1.25;
    font-size: .92em;
    color: var(--ink);
  }
  @keyframes settle { from { opacity: 0; transform: rotate(4deg) translateY(-24px); } to { opacity: 1; transform: rotate(-3deg); } }
  .unwritten { color: transparent; }
  .nib {
    display: inline-block;
    width: .28em; height: .28em;
    margin-left: .08em;
    border-radius: 50%;
    background: var(--ink);
    vertical-align: middle;
    animation: blink .9s steps(2) infinite;
  }

  .skip, .again {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .skip {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 3;
    padding: .55rem 1.3rem;
    border: 1px solid rgba(38, 48, 110, .18);
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    color: var(--ink);
    box-shadow: 0 10px 24px -12px var(--shadow);
    backdrop-filter: blur(6px);
  }
  .again {
    display: block;
    margin: 2.2rem auto 0;
    padding: .5rem 1.2rem;
    border: none;
    background: none;
    color: var(--muted);
    position: relative;
    z-index: 1;
    animation: fadeIn 1.2s ease both;
  }
  .skip:focus-visible, .again:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }

  /* ---------- Pétalos ---------- */
  .petal {
    position: fixed;
    top: -6vh;
    width: 11px; height: 14px;
    background: var(--petal);
    border-radius: 70% 0 70% 0;
    opacity: .7;
    pointer-events: none;
    z-index: 0;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(520deg); }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes fadeAway { to { opacity: 0; transform: scale(.97); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: .95; } }
  @keyframes blink { 0% { opacity: .75; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

(function () {

  const PARRAFOS = [
    { t: "Andreina:", c: "saludo" },
    { t: "Si estás leyendo esto, es porque por fin me atreví. Llevo mucho tiempo cargando estas palabras en el pecho, y hoy entendí que no quiero seguir guardándolas." },
    { t: "Hay personas que llegan a tu vida y la cambian sin hacer ruido. Tú fuiste eso para mí. Y yo, en vez de cuidarte, fui inmaduro. Puse por encima a mis amigos y a mi familia, y te fallé cuando más debía estar. En serio, me faltó ser más hombre para estar a tu lado. No tengo excusas, ni las quiero buscar. Solo te pido perdón, con todo lo que soy." },
    { t: "Lo que más me duele no es haberte perdido. Es saber que fue por mi culpa, y que tú merecías a alguien que supiera verte como yo te veo ahora." },
    { t: "Lo único que más le reclamo al destino es no haberte conocido en la etapa más madura e independiente de mi vida. Créemelo, hubiéramos terminado siendo pareja." },
    { t: "Sé que hoy eres feliz con él. Y aunque me cueste, te lo digo con el corazón en la mano: me alegra verte bien. Porque aprendí que querer de verdad es eso, desear la felicidad de alguien aunque no sea a tu lado." },
    { t: "Cada noche le hablo a Dios de ti. No le pido que te aleje de nada ni de nadie. Solo le ruego que, si algún día tiene que ser, las cosas se den, y me permita demostrarte todo lo que no supe demostrarte antes." },
    { t: "Mientras tanto, voy a crecer. Voy a hacer todo para dar mi mejor versión. Voy a sacar adelante mi empresa y voy a ganarme esa beca. Y cuando lo logre, cuando por fin sea el hombre que siempre supiste que podía ser, te voy a buscar. No para exigirte nada, solo para ofrecerte lo que siempre te mereciste." },
    { t: "Porque sé lo que vales. Sé lo que te mereces. Y quiero estar ahí en cada uno de tus sueños. Voy a luchar por tu negocio, aunque sé que a veces te da pereza, y voy a luchar contigo por tu tesis hasta verte terminarla, aunque tenga que aplaudirte desde lejos." },
    { t: "Voy a luchar por ese viaje a Perú. Y a veces cierro los ojos y te imagino conmigo, lejos de aquí, empezando de cero en España. Te juro que voy a luchar con todo para que ese sueño deje de ser solo un sueño. Tú sabes que lo voy a cumplir. Solo le ruego a Dios que sea a tu lado." },
    { t: "Te confieso algo. Al inicio, de verdad, no quería tener una familia. Llegué al punto de decepcionarme de la mía. Pero contigo entendí que uno tiene que estar para alguien por el resto de su vida. Y sí, pensé en Fulquito Pincay Araujo. Solo espero que Dios me ayude, porque sí quiero. Preferiría perder toda mi inteligencia y todas mis oportunidades antes que perder la posibilidad de estar juntos y formar una familia en España." },
    { t: "Y pase lo que pase, hay algo que nunca va a cambiar: estoy para ti. Si algún día necesitas algo, lo que sea, recuerda que te voy a escribir y voy a estar ahí. Aunque haya pasado mucho tiempo. Aunque ya no me esperes." },
    { t: "Gracias por haber existido en mi vida. Aunque no supe quedarme bien en la tuya, tú sigues siendo lo más bonito que me ha pasado." },
    { t: "Con todo lo que tengo, y con todo lo que voy a ser.", c: "firma" }
  ];

  const ES_PRUEBA = /prueba/.test(window.location.search);
  function avisar(msg) {

      else if (ch === ",") d = 170;
      const id = setTimeout(function () { setN(function (x) { return x + 1; }); }, d);
      return function () { clearTimeout(id); };
    }, [etapa, n]);

    // Párrafo que se está escribiendo
    let actual = -1;
    if (n < TOTAL) {
      for (let i = PARRAFOS.length - 1; i >= 0; i--) {
        if (n >= STARTS[i]) { actual = i; break; }
      }
    }

    // Seguir la escritura con el scroll
    useEffect(function () {
      if (etapa !== "leyendo" || actual < 1) return;
      const el = refs.current[actual];
      if (!el) return;
      const r = el.getBoundingClientRect();
      const limite = window.innerHeight - 110;
      if (r.bottom > limite) {
        window.scrollBy({ top: r.bottom - limite + 40, behavior: "smooth" });
      }
    }, [actual, etapa]);

    if (etapa !== "leyendo") {
      return h("main", { className: "intro" + (etapa === "abriendo" ? " leaving" : "") },
        h("p", { className: "para" }, "Andreina, esto es para ti."),
        h(Sobre, { abierto: etapa === "abriendo", onAbrir: abrir }),
        h("p", { className: "hint" }, etapa === "cerrado" ? "Toca el sello para abrir" : "\u00a0")
      );
    }

    const terminado = n >= TOTAL;

    return h("main", { className: "reading" },
      !REDUCE && PETALOS.map(function (p, i) {
        return h("span", {
          key: i,
          className: "petal",
          "aria-hidden": "true",
          style: {
            left: p.left + "vw",
            animationDuration: p.dur + "s",
            animationDelay: p.delay + "s",
            "--drift": p.drift,
            scale: String(p.scale)
          }
        });
      }),
      h("article", { className: "letter", "aria-label": "Carta para Andreina" },
        h("figure", { className: "polaroid" },
          h("img", { src: FOTO, alt: "Foto de Andreina" }),
          h("figcaption", null, "Siempre quise tenerte en mi billetera.")
        ),
        PARRAFOS.map(function (p, i) {
          const escritos = Math.max(0, Math.min(p.t.length, n - STARTS[i]));
          return h("p", {
            key: i,
            className: p.c || undefined,
            ref: function (el) { refs.current[i] = el; }
          },
            h("span", null, p.t.slice(0, escritos)),
            i === actual ? h("span", { className: "nib", "aria-hidden": "true" }) : null,
            h("span", { className: "unwritten" }, p.t.slice(escritos))
          );
        })
      ),
      terminado
        ? h("button", { className: "again", onClick: reiniciar }, "Leer otra vez")
        : h("button", { className: "skip", onClick: function () { setN(TOTAL); } }, "Mostrar toda la carta")
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
